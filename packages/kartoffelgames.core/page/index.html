<html>
<head>
    <title>Astar</title>
    <link rel="stylesheet" href="./index.css">
    <script src="/build/page.js" defer></script>
</head>
<body>
    <main class="astar-page">
        <div class="astar-page__grid"></div>
        <section class="astar-page__editors">
            <label class="astar-page__editor">
                <span class="astar-page__editor-label">costOfTraversal(node, pathInformation)</span>
                <textarea id="cost-of-traversal" spellcheck="false"></textarea>
            </label>
            <label class="astar-page__editor">
                <span class="astar-page__editor-label">heuristic(currentNode, endNode)</span>
                <textarea id="heuristic" spellcheck="false"></textarea>
            </label>
        </section>
    </main>
</body>
</html>
