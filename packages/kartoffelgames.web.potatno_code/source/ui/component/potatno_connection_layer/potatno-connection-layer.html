<svg #svgLayer class="svg-layer" xmlns="http://www.w3.org/2000/svg" (contextmenu)="this.onContextMenu($event)"></svg>
$if(this.hasTempConnection) {
    <svg class="svg-layer temp-wire-layer" xmlns="http://www.w3.org/2000/svg">
        <path class="temp-wire" fill="none" d="{{this.tempWirePath}}"></path>
    </svg>
}
