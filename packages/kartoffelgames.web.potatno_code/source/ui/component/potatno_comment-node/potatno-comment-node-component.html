<!-- Resizeable part of node -->
<potatno-resize-box #ResizeBox class="node" top="true" right="true" bottom="true" left="true" [snap]="25" [virtual]="true" (resize)="this.transformNodeData($event.value)">
    <div class="node-header" (pointerdown)="this.dragNode($event)">
        <span class="node-header__icon">✎</span>
        <span class="node-header__label">{{this.comment}}</span>
    </div>

    <div class="node-body"/>
</potatno-resize-box>
