<!-- Serves only as a background. -->
<div class="grid-background" [style]="this.gridBackgroundStyle"></div>

<div class="grid-content" [style]="this.gridTransformStyle">
    <potatno-connection-layer/>

    $for(nodeState of this.visibleNodes) {
        <potatno-node class="grid-content__node {{this.nodeState.selected ? 'selected' : ''}}" style="left:{{this.nodeState.pixelX}}px; top:{{this.nodeState.pixelY}}px; width:{{this.nodeState.pixelW}}px; height:{{this.nodeState.pixelH}}px;" [nodeData]="this.nodeState.node" (pointerdown)="this.onNodePointerDown($event, this.nodeState.node)"/>
    }
</div>

$if(this.showSelectionBox) {
    <div class="selection-box" [style]="this.selectionBoxStyle"></div>
}

$if(this.showAddNodePopup) {
    <potatno-node-selection-popup [style]="this.addNodePopupStyle" (node-select)="this.onAddNodePopupNodeSelect($event)"/>
}
