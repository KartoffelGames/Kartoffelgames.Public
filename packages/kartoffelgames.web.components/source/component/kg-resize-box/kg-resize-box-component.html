<!-- In order of top-left clockwise. Needed for styling -->
$if(this.top && this.left) {
    <div class="resize-handle corner top left" kg-pannable (kg-pan)="this.resizeCorner($event)"></div>
}
$if(this.top) {
    <div class="resize-handle horizontal top {{this.left ? 'hasPrevious' : ''}} {{this.right ? 'hasNext' : ''}}" kg-pannable (kg-pan)="this.resizeHorizontal($event)"></div>
}
$if(this.top && this.right) {
    <div class="resize-handle corner top right" kg-pannable (kg-pan)="this.resizeCorner($event)"></div>
}
$if(this.right) {
    <div class="resize-handle vertical right {{this.top ? 'hasPrevious' : ''}} {{this.bottom ? 'hasNext' : ''}}" kg-pannable (kg-pan)="this.resizeVertical($event)"></div>
}
$if(this.bottom && this.right) {
    <div class="resize-handle corner bottom right" kg-pannable (kg-pan)="this.resizeCorner($event)"></div>
}
$if(this.bottom) {
    <div class="resize-handle horizontal bottom {{this.left ? 'hasPrevious' : ''}} {{this.right ? 'hasNext' : ''}}" kg-pannable (kg-pan)="this.resizeHorizontal($event)"></div>
}
$if(this.bottom && this.left) {
    <div class="resize-handle corner bottom left" kg-pannable (kg-pan)="this.resizeCorner($event)"></div>
}
$if(this.left) {
    <div class="resize-handle vertical left {{this.top ? 'hasPrevious' : ''}} {{this.bottom ? 'hasNext' : ''}}" kg-pannable (kg-pan)="this.resizeVertical($event)"></div>
}

<div class="content-container">
    $slot
</div>
