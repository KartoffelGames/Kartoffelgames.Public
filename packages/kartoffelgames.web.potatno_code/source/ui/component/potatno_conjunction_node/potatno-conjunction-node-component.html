<div class="node {{this.selected ? 'selected' : ''}}" style="--type-color: {{this.portColor}}" (dragover)="this.onDragOver($event)" (drop)="this.onDrop($event)">

    <div class="port input" draggable="true" [title]="this.portValueType" (dragstart)="this.onDragStart($event)" (dragend)="this.onDragEnd($event)">
        <potatno-port-handle class="port__handle" [port]="this.inputPort" [connected]="this.isInputConnected" />
    </div>

    <div class="drag-area" (pointerdown)="this.dragNode($event)"/>

    <div class="port output" draggable="true" [title]="this.portValueType" (dragstart)="this.onDragStart($event)" (dragend)="this.onDragEnd($event)">
        <potatno-port-handle class="port__handle" [port]="this.outputPort" [connected]="this.isOutputConnected" />
    </div>

    <svg #dragConnection class="port-drag-connection" xmlns="http://www.w3.org/2000/svg">
        <path #dragPath xmlns="http://www.w3.org/2000/svg"></path>
    </svg>

</div>
