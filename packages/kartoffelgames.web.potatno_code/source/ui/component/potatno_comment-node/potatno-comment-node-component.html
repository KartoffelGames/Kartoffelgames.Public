<!-- Resizeable part of node -->
<kg-resize-box #ResizeBox class="node {{this.editMode ? 'edit' : ''}}" top="true" right="true" bottom="true" left="true" [snap]="this.gridSize" virtual="true" (resize)="this.transformNodeData($event.value)">
    <div class="node-header" (pointerdown)="this.dragNodeOrEnableEdit($event)" (dblclick)="this.editMode = true;">
        <span class="node-header__icon">✎</span>

        $if(this.editMode) {
            <input #CommentInput class="node-header__comment-edit" [(value)]="this.comment" (blur)="this.editMode = false;" (keydown)="this.escapeEditMode($event)"/>
        }
        $if(!this.editMode) {
            <span class="node-header__comment">{{this.comment}}</span>
        }
        
    </div>

    <div class="node-body"/>
</kg-resize-box>

<div style="--zoom-factor: {{this.gridZoom}}; --comment-node-height: {{this.nodeData?.transformation.height}}; --comment-node-width: {{this.nodeData?.transformation.width}};" class="satellite-view {{this.enableBigview ? 'enabled' : ''}}">
    <!-- Div needed to decouple inner text from size restriction of satellite-view flex -->
    <div>
        <div class="satellite-view__text">{{this.comment}}</div>
    </div>
</div>
