<!-- Main port. Defining dimensions and -->
<div class="port-wrapper {{this.portDirection}}" style="--port-color: {{this.portColor}}">

    <div class="port {{this.portWrapperClasses}}" [title]="this.portTypeLabel" (pointerdown)="this.onPointerDown($event)">
        <div class="port__handle {{this.portHandleClasses}}"></div>
        <div class="port__label">{{this.portName}}</div>
    </div>

    $if(this.showDirectValueInput) {
        <div class="direct-value-inputs" (pointerdown)="$event.stopImmediatePropagation()">
            $for(inputDef of this.directValueInputDefs) {
                <div class="direct-value-field">
                    <span class="direct-value-label">{{this.inputDef.name}}</span>
                    <input [type]="this.inputDef.htmlType" class="direct-value-input" [value]="this.inputDef.value" (change)="this.onDirectValueInput($event, this.inputDef.index)"/>
                </div>
            }
        </div>
    }

</div>
