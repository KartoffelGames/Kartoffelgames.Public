<html>
<head>
    <title>Potatno Code Editor</title>
    <link rel="stylesheet" href="./index.css">
    <script src="bundle/page.js" defer></script>
</head>
<body>
    <div class="potatno-code-toolbar">
        <div id="save-button" class="potatno-code-toolbar-button">Save</div>
        <div id="load-button" class="potatno-code-toolbar-button">Load</div>
        <label id="font-size-control" class="potatno-code-toolbar-button">
            <span id="font-size-value">100%</span>
            <input id="font-size-slider" type="range" min="5" max="50" step="0.1" value="16">
        </label>
    </div>
    <div id="application-root"></div>
</body>
</html>
