<!-- Serves only as a background. -->
<div class="grid-background" [style]="this.gridBackgroundStyle"></div>

<div class="grid-content" [style]="this.gridTransformStyle">
    <potatno-connection-layer/>

    $for(node of this.nodes) {
        <potatno-node class="grid-content__node {{this.selectedNode.has(this.node) ? 'selected' : ''}}" [nodeData]="this.node" (node-drag)="this.moveAllSelected(this.node, $event.value)" (pointerdown)="this.selectNode($event, this.node)"/>
    }
</div>

$if(this.selectBox !== null) {
    <div class="selection-box" style="left: {{this.selectBox.x}}px; top: {{this.selectBox.y}}px; width: {{this.selectBox.width}}px; height: {{this.selectBox.height}}px;"></div>
}

$if(this.popupPosition !== null) {
    <potatno-node-selection-popup style="left: {{this.popupPosition.screenX}}px; top: {{this.popupPosition.screenY}}px;" (node-select)="this.createNodeOnPopupPosition($event.value)"/>
}
