<div #canvasWrapper class="canvas-wrapper" [style]="this.gridBackgroundStyle" (pointerdown)="this.onCanvasPointerDown($event)" (wheel)="this.onCanvasWheel($event)" (contextmenu)="this.onContextMenu($event)">
    <div #gridLayer class="grid-layer" [style]="this.gridTransformStyle">
        <potatno-connection-layer></potatno-connection-layer>
        <div class="node-layer">
            $for(nodeState of this.visibleNodes) {
                <div class="node-position" style="left:{{this.nodeState.pixelX}}px; top:{{this.nodeState.pixelY}}px; width:{{this.nodeState.pixelW}}px; height:{{this.nodeState.pixelH}}px;">
                    <potatno-node [nodeData]="this.nodeState.node" [selected]="this.nodeState.selected" (pointerdown)="this.onNodePointerDown($event, this.nodeState.node)" (resize-start)="this.onNodeResizeStart($event)"/>
                </div>
            }
        </div>
    </div>
    $if(this.showSelectionBox) {
        <div class="selection-box" [style]="this.selectionBoxStyle"></div>
    }

    $if(this.showAddNodePopup) {
        <potatno-add-node-popup [style]="this.addNodePopupStyle" (node-select)="this.onAddNodePopupNodeSelect($event)"/>
    }
</div>
